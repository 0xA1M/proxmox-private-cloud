services:
  # Metrics storage, alert evaluation, and remote write receiver
  # Alloy agents on target VMs push metrics here via remote_write
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"                    # Web UI + API
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml  # Main config
      - ./configs/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml  # Alert rules
      - ./configs/prometheus/targets:/etc/prometheus/targets                # Static targets
      - prometheus_data:/prometheus    # Persistent metric storage
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'  # Accept remote_write from Alloy agents
      - '--web.enable-admin-api'              # Allow deleting stale TSDB series via API

  # Exposes Proxmox VE host metrics (CPU, memory, storage, guests, network)
  # Scraped by Prometheus at /pve with module=default, target=10.0.0.2
  pve-exporter:
      image: prompve/prometheus-pve-exporter:latest
      container_name: pve-exporter
      restart: always
      ports:
        - "9221:9221"
      volumes:
        - ./configs/pve-exporter/pve.yml:/etc/prometheus/pve.yml  # Proxmox API token auth

  # Log aggregation — receives log pushes from Alloy agents
  # Single-binary mode (TSDB index, filesystem storage, in-memory KV store)
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"                    # Log push API + query API
    volumes:
      - ./configs/loki/loki-config.yml:/etc/loki/loki-config.yml  # Loki config
      - loki_data:/loki                # Persistent log storage (chunks + index)

    command:
      - '-config.file=/etc/loki/loki-config.yml'

  # Dashboard UI — auto-provisions Prometheus + Loki datasources and 3 dashboards
  # Admin password injected via .env file (templated from Ansible Vault)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana               # Persistent dashboard/datasource state
      - ./configs/grafana/provisioning:/etc/grafana/provisioning  # Auto-provisioning configs
    environment:
      - GF_SECURITY_ADMIN_USER=admin                 # Hardcoded admin username
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}  # From .env file

  # Alert routing and deduplication
  # Port not exposed to host — only internal Docker network (Prometheus needs it)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    volumes:
      - ./configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  # Forwards Alertmanager alerts to a Discord webhook
  # Uses benjojo's implementation (rogerrum has a bug with embed format)
  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    container_name: alertmanager-discord
    restart: always
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_URL}  # Discord webhook URL from .env

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
